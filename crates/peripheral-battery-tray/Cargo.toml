[package]
name = "peripheral-battery-tray"
version = "0.1.0"
description = "Windows tray battery monitor for ASUS ROG and Logitech wireless peripherals"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
logitech-battery = { path = "../logitech-battery" }
rog-battery = { git = "https://github.com/SteveWang92/rog-battery-tray", tag = "v0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
tauri-winrt-notification = "0.8.1"
toml = "1.1.8"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader"] }
winreg = "0.56.0"

[build-dependencies]
embed-resource = "3.0.12"
