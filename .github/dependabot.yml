version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 2
    cooldown:
      default-days: 21
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 2
    cooldown:
      default-days: 21
      semver-major-days: 30
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
